name: SwiftKord
options:
  bundleIdPrefix: com.swiftkord
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"
    visionOS: "2.0"
settings:
  base:
    SWIFT_VERSION: "6.2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: SwiftKord
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SwiftKordApp:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
    sources:
      - SwiftKordApp
  SwiftKordAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SwiftKordAppTests
    dependencies:
      - target: SwiftKordApp
  SwiftKordAppMac:
    type: application
    platform: macOS
    sources:
      - SwiftKordApp
  SwiftKordAppVision:
    type: application
    platform: visionOS
    sources:
      - SwiftKordApp
